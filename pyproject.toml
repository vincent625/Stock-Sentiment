[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qqq-news-sentiment-study"
version = "0.1.0"
description = "Lagged news sentiment versus forward abnormal returns, with market reaction-speed analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
parquet = ["pyarrow>=14.0"]

[project.scripts]
qqq-sentiment = "qqq_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
